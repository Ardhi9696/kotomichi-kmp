[versions]
kotlin = "2.0.0"
agp = "8.4.0"
kotlinx.coroutines = "1.8.0"
kotlinx.serialization = "1.6.3"
ktor = "3.0.1"
sqldelight = "2.0.1"
koin = "3.5.3"
androidx.lifecycle = "2.7.0"
androidx.compose = "2024.05.00"
androidx.activity = "1.9.0"
androidx.security = "1.1.0-alpha06"
material3 = "1.2.1"
turbine = "1.0.1"
junit = "4.13.2"
androidx.work = "2.9.0"
timber = "5.0.1"

[libraries]
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx.coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx.coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx.serialization" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-serialization = { module = "io.ktor:ktor-client-serialization-kotlinx", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging-jvm", version.ref = "ktor" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }

sqldelight-runtime = { module = "com.squareup.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "com.squareup.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "com.squareup.sqldelight:native-driver", version.ref = "sqldelight" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx.lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx.lifecycle" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidx.security" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx.compose" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx.activity" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx.activity" }

androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx.work" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
kotlin.multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin.serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android.application = { id = "com.android.application", version.ref = "agp" }
sqldelight = { id = "com.squareup.sqldelight", version.ref = "sqldelight" }